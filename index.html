<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="QA Practice Lab is a safe, structured environment for learning software testing across twelve disciplines."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" id="theme-color" content="#f6f7f8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>QA Practice Lab</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('qa-practice-lab-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          var meta = document.getElementById('theme-color')
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#0b1220' : '#f6f7f8')
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
